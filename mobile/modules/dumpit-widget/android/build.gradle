// Glance(위젯 UI)는 Compose 컴파일러가 필요하다. Kotlin 2.x에서는 버전을 rootProject의
// expo-root-project 플러그인이 채워둔 `kotlinVersion` ext 프로퍼티에서 그대로 가져온다
// (expo-modules-core/expo-dev-menu 등 이 저장소의 다른 expo 모듈과 동일한 패턴).
// 따라서 이 파일은 앱 루트(mobile/android)의 서브프로젝트로 포함될 때만 유효하다.
// IDE Java/Gradle 확장이 이 폴더를 단독 루트로 스캔하면 kotlinVersion이 없으므로
// 여기서 평가를 중단한다(실빌드에는 항상 존재).
if (!hasProperty('kotlinVersion')) return

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // buildscript 블록은 스크립트 본문보다 먼저 평가되므로 아래 본문 가드가 여기까지
    // 미치지 않는다. 단독 스캔(kotlinVersion 부재)이면 classpath 등록도 건너뛴다.
    def composeKotlinVersion = project.findProperty('kotlinVersion')
    if (composeKotlinVersion != null) {
      classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${composeKotlinVersion}")
    }
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'kr.dumpit.widget'
version = '0.1.0'

android {
  namespace "kr.dumpit.widget"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation "androidx.glance:glance-appwidget:1.1.1"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  // PomodoroCommandService(HeadlessJsTaskService) — 위젯 버튼이 RN 헤드리스 태스크를 기동한다.
  // 버전은 React Native Gradle Plugin이 루트에서 해석(app/build.gradle과 동일 패턴).
  implementation "com.facebook.react:react-android"
}
