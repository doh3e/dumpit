<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var p = localStorage.getItem('dumpit-theme');
        var t = (p === 'light' || p === 'dark') ? p
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        // 글자 크기 부트 적용 — utils/fontScale.js의 FONT_SCALES와 값 동기화 유지
        var f = localStorage.getItem('dumpit-font-scale');
        var scales = { sm: '90%', lg: '112.5%', xl: '125%' };
        if (scales[f]) document.documentElement.style.fontSize = scales[f];
      })();
    </script>
    <!-- 랜딩 히어로(LCP, 288px) 기준 preload — img srcset과 동일 후보라 홈에서 중복 요청 없음 -->
    <link rel="preload" as="image" href="/logo.webp" imagesrcset="/logo_144.webp 144w, /logo_180.webp 180w, /logo_216.webp 216w, /logo_288.webp 288w, /logo_432.webp 432w, /logo.webp 576w" imagesizes="288px" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Galmuri11.subset.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/DungGeunMo.subset.woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="덤핏 - AI가 도와주는 지능형 일정 관리" />
    <title>덤핏(Dumpit!)</title>
    <!--
      Google Analytics (GA4). 운영 도메인에서만 로드해 로컬 개발·프리뷰 트래픽이 통계에 섞이지 않게 한다.
      LCP 프리로드보다 뒤에 두고 async로 받으므로 첫 렌더를 막지 않는다.
      개인정보처리방침 제7·8·10조에 위탁·국외이전·분석 쿠키로 고지돼 있다.
    -->
    <script>
      (function () {
        if (!/(^|\.)dumpit\.kr$/.test(location.hostname)) return;
        var ID = 'G-7CZMLEM04D';
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', ID);
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
